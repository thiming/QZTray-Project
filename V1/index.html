<html>
    <body>
        <script src="./qz-tray.js"></script>
        
        <h1 id="qzStatus">Placeholder</h1> <script> document.getElementById("qzStatus").textContent = "No connection to QZTray" </script>

        <h1 id="printerStatus">Placeholder</h1> <script> document.getElementById("printerStatus").textContent = "No printer found yet"</script>

        <h1>Something</h1>

        <button id="printButton" onclick="sendPrint()">Print</button>

        <script> <!-- block for connecting to QZTray -->
            var printer = null
            qz.websocket.connect().then(function() {
            document.getElementById("qzStatus").textContent = "QZTray Connected";
            scanForPrinter()
            }); 

            function scanForPrinter() {
                qz.printers.find("zebra").then(function(found) {
                printer = found;
                document.getElementById("printerStatus").textContent = found
            });}


            //Testfunction, creates random string.
            function randomString(length = 8) { 
                const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
                let result = "";

                for (let i = 0; i < length; i++) {
                    result += chars.charAt(Math.floor(Math.random() * chars.length));
                }

                return result;
            }


            async function pullPrintData() {

                const response = await fetch("./Label.zpl");
                if (!response.ok) {
                    throw new Error("Error at pullPrintData (response not ok)")
                }
                
                let modifiedResponse = String(response) 
                //modifiedResponse.replace("{{TEXT}}", new String(randomString()));
                //modifiedResponse.replace("{{SUBTEXT}}", new String(randomString()));

                return (modifiedResponse);


            }

            async function sendPrint() {

                var config = qz.configs.create(printer);               // Exact printer name from OS
                var data = [await pullPrintData()];   // Raw commands (ZPL provided)

                

                qz.print(config, data).then(function() {
                document.getElementById("printButton").textContent = "Sent!" 
            });
        } 
        </script>

       <!-- <script src="./connectAndPrint.js"></script> --> 

        <!-- <script type="text/javascript" src="./qz-tray.js"></script> -->
        <!-- <script type="module" src="./connectAndPrint.js"></script> -->
    </body>
    
</html>
