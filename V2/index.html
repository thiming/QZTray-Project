<html>
    <head>
        <title>
            UUID Label Generator
        </title>
    </head>
    <body>

        <script src="javascript/qz-tray.js"></script> <!-- Import QZ library for use in broader doc -->

        <div style="position: sticky; top: 10px; left: 30px"> 

            <h3>Status</h3>
            <span 
                id="qzConnectedIndicator"; 
                style="background-color: crimson; color: black;"
                    >
                    QZTray Offline
            </span>

            <span style="padding-left: 50px;"></span>

            <span 
                id="prnConnectedIndicator":
                style="background-color: crimson; color: black ;" 
                class="text"
                    >
                    Printer Connected
            </span>
            
            <h3>Control Panel</h3>
            <button id="qzConnectButton" onclick="qzConnectFunction()">Connect to QZTray service</button>
            <button id="printerConnectButton" onclick="prnConnectFunction()">Connect to printer</button>
            <select id="prnSelector">
            </select>

            <h3>Print Panel</h3>
            <button id="sendPrintButton" onclick="sendPrintFunction()">Send Printjob</button>
            <select id=amountSelector>
                <option value="100">100 labels</option>
                <option value="200">200 labels</option>
                <option value="300">300 labels</option>
                <option value="400">400 labels</option>
                <option value="500">500 labels</option>
            </select>

            <h3>Diag</h3>
            <p id="DIAGBOX"></p>

        </div>

        <script>
            console.info(genSerial());//debug
            function qzConnectFunction() {
                qz.websocket.connect().then(function() {
                document.getElementById("qzConnectedIndicator").style.background = 'green';
                document.getElementById("qzConnectedIndicator").textContent = "QZTray Online";
                listAllPrinters()
                }); 
            }
            function prnConnectFunction() {
                qz.printers.find(document.getElementById("prnSelector").value).then(function(found) {
                if (document.getElementById("prnSelector").value) {
                    document.getElementById("prnConnectedIndicator").style.background = 'green';
                    document.getElementById("prnConnectedIndicator").textContent = "Printer Online";
                }
                });
            }
            function listAllPrinters() {
                qz.printers.find().then(function(data) {
                      var list = '';
                      var selectElement = document.getElementById("prnSelector");
                      for(var i = 0; i < data.length; i++) {
                        if (data[i].toLowerCase().includes("zebra")) {
                            selectElement.add(new Option(data[i]));
                        }
                     }
                     
                  }).catch(function(e) { console.error(e); });
            }

            async function pullPrintData(path) {
                const response = await fetch(path);
                if (!response.ok) throw new Error("fetch seems to have failed at pullPrintData()")
                let modifiedResponse = await response.text();
                return(modifiedResponse);
            }

            function genSerial() {
                const date = new Date()
                let year = date.getFullYear().toString()
                let month = date.getMonth().toString()
                if(month.length < 2) {
                    month = '0' + month
                }

                return(year+month)
            }

            async function sendPrintFunction() {
                   var config = qz.configs.create(document.getElementById("prnSelector").value);  
                   var data = [await pullPrintData('./assets/ServiceSN.prn')];
                   let stringData = String(data);
                   for (let i = 0; i < document.getElementById('amountSelector').value ; i++) {
                        
                        console.info(stringData.replace("{{HRCODE}}", new String( genSerial() + i.toString().padStart(3, '0') )));
                   }
                    
      
                   
                 

                   //qz.print(config, data);
                   //document.getElementById('sendPrintButton').textContent = "Sent!"
                   //setTimeout(() => document.getElementById('sendPrintButton').textContent = "Send Printjob", 5000);
            };
        </script>



    </body>

</html>
